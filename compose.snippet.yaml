# Add this service to the Compose file that already runs Forgejo.
# Put it on the same network so it can reach Forgejo by service name,
# then point a Cloudflare Tunnel hostname at it (e.g. studio-git.kitcab.co.nz -> http://forgejo-gitlab-shim:8080).
services:
  forgejo-gitlab-shim:
    image: ghcr.io/victpork/forgejo-gitlab-shim:latest
    container_name: forgejo-gitlab-shim
    restart: unless-stopped
    environment:
      FORGEJO_URL: http://forgejo:3000                      # internal address of Forgejo (service name + port)
      FORGEJO_PUBLIC_URL: https://forgejo.com               # used for "view commit/file" links in Studio
      ALLOWED_ORIGINS: https://your-site.example            # origin(s) of the Nuxt site that runs Studio, comma-separated
      ALLOWED_REPOS: your-user/your-repo                    # optional: only expose these repos
      ALLOWED_BRANCHES: main                                # branches commits may go to, comma-separated (default: main)
      ALLOWED_PATHS: content/                               # directories commits may change, comma-separated (default: content/)
      COMMITTER_NAME: content-bot                           # required: git committer of every commit (the token's bot account)
      COMMITTER_EMAIL: content-bot@your-forgejo-host.com    # required
      # MAX_BODY_MB: 25                                     # max publish size (media uploads are base64)
    depends_on:
      - forgejo
    # No ports needed when the tunnel connector is on the same Docker network.
    # ports:
    #   - "8080:8080"
